name: Secret scan

# Scans commits and the working tree for leaked credentials with gitleaks.
# Complements the product-side secret-scanner (src/secret-scanner.ts), which
# guards *knowledge-base content* — this guards the *repository itself*.
#
# Note: gitleaks-action is free for personal-account repos. If this repo ever
# moves under a GitHub *organization*, set the GITLEAKS_LICENSE secret or swap
# to running the gitleaks binary directly.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the scan covers commits, not just the checkout.
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
