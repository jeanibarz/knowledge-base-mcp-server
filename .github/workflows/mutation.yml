name: Mutation Tests

# Issue #651 — Stryker mutation testing measures whether the test suite
# actually *kills* injected bugs in the curated core modules (see
# stryker.conf.json `mutate`). Mutation runs are slow, so this is nightly +
# manual only — NOT per-PR — to keep the contributor loop fast. The
# `thresholds.break` gate in stryker.conf.json fails the job when the
# mutation score drops below the observed baseline.
on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: npm
          node-version: 24
      - run: |
          npm ci --ignore-scripts
          npm rebuild faiss-node hnswlib-node onnxruntime-node sharp esbuild protobufjs
      - run: npm run test:mutation
      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: reports/mutation/
          if-no-files-found: ignore
