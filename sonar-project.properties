# SonarQube analysis config — binds this checkout to the same project the
# SonarLint IDE integration uses (.vscode/settings.json → projectKey
# `gundestrup_knowledge-base-mcp-server`). Driven by .github/workflows/sonar.yml.
#
# Required CI secret: SONAR_TOKEN.
# Self-hosted SonarQube Server instead of SonarQube Cloud: remove
# `sonar.organization` below and add a SONAR_HOST_URL repository secret.
sonar.projectKey=gundestrup_knowledge-base-mcp-server
sonar.organization=gundestrup

sonar.sources=src
sonar.tests=src
sonar.exclusions=src/**/*.test.ts,src/**/__fixtures__/**,src/**/__property-tests__/**,src/test-support/**,src/e2e/**
sonar.test.inclusions=src/**/*.test.ts

# `jest --coverage` (v8 provider) writes coverage/lcov.info — see jest.config.js.
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.json
